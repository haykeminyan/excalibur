services:
  database:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    networks:
      - excalibur_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h database"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    restart: always
    networks:
      - excalibur_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  excalibur:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
          python manage.py runserver 0.0.0.0:8000;
      "
    volumes:
      - ./apps/facture:/usr/src/app/apps/facture
      - ./apps/deduction:/usr/src/app/apps/deduction
      - ./apps/users:/usr/src/app/apps/users
      - ./apps/main:/usr/src/app/apps/main
      - ./locale:/usr/src/app/locale
      - ./excalibur:/usr/src/app/excalibur
      - ./staticfiles:/usr/src/app/staticfiles
    restart: always
    environment:
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=excalibur.settings
      - ENVIRONMENT=development
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_QUEUE_LOCAL_FACTURE=${RABBITMQ_QUEUE_LOCAL_FACTURE}
      - RABBITMQ_QUEUE_WORLD_FACTURE=${RABBITMQ_QUEUE_WORLD_FACTURE}
      - RABBITMQ_QUEUE_DEDUCTIONS=${RABBITMQ_QUEUE_DEDUCTIONS}
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq//
      - CELERY_RESULT_BACKEND=rpc://
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/main/healthcheck/"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    expose:
      - 8000
    ports:
      - "8000:8000"
    networks:
      - excalibur_network
    working_dir: /usr/src/app
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    networks:
      - excalibur_network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery:
    build: .
    command: sh -c "python wait_for_service.py && celery -A excalibur worker --loglevel=info"
    volumes:
      - .:/usr/src/app
      - ./logs:/usr/src/app/logs
    environment:
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq//
      - CELERY_RESULT_BACKEND=rpc://
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - excalibur_network
    env_file:
      - .env

  flower:
    build: .
    command: sh -c "python -m flower flower --broker=pyamqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq// --port=5555"
    ports:
      - "5555:5555"  # Flower Web UI
    depends_on:
      - rabbitmq
      - celery
    networks:
      - excalibur_network
    environment:
      - FLOWER_BASIC_AUTH=${FLOWER_USER}:${FLOWER_PASSWORD}
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  letsencrypt:

networks:
  excalibur_network:
    driver: bridge
