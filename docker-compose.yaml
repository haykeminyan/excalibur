version: '3.9'

services:
  database:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pmsolution_facture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5433:5432'

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'  # Expose Redis on port 6379
    restart: always


  excalibur:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/facture:/usr/src/app/apps/facture
      - ./apps/deduction:/usr/src/app/apps/deduction
      - ./apps/users:/usr/src/app/apps/users
      - ./excalibur:/usr/src/app/excalibur
    restart: always
    environment:
      - POSTGRES_NAME=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - database
    expose:
      - 8000
    ports:
      - "8000:8000"
    working_dir: /usr/src/app


volumes:
  postgres_data:
