<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %} <!-- Load Django static template tag -->
    <meta charset="UTF-8">
    <title>Create Facture</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    {% block stylesheets %}
        <!-- Correct usage of static tag -->
        <link rel="stylesheet" type="text/css" href="{% static 'facture/css/styles.css' %}">
    {% endblock stylesheets %}

{% block scripts %}
    <!-- Correct usage of the static tag for JavaScript -->
    <script src="{% static 'facture/js/tools.js' %}"></script>
{% endblock scripts %}
</head>
<body>
    <div class="container mx-auto">
        <h1>Create New Facture</h1>
        <form method="post" action="{% url 'create-facture' %}" >
            {% csrf_token %}

            <!-- Facture Number -->
        <div class="grid-container">
<div class="grid-container-first">
    <!-- Facture Number -->
    <div class="grid-item">
        <label for="number_facture" class="block text-gray-700">{{ facture_form.number_facture.label }}</label>
        <input type="number" name="number_facture" id="number_facture" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" value="{{ facture_form.number_facture.value }}">
    </div>

    <!-- Facture Date -->
    <div class="grid-item">
        <label for="date" class="block text-gray-700">Date</label>
        <input type="date" name="date" id="date" value="{{ facture.date }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <!-- Reference -->
    <div class="grid-item">
        <label for="reference" class="block text-gray-700">Reference</label>
        <input type="text" name="reference" id="reference" value="{{ facture.reference }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <!-- Address -->
    <div class="grid-item address-item">
        <label for="address" class="block text-gray-700">Address</label>
        <textarea name="address" id="address" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ facture.address }}</textarea>
    </div>

</div>


            <div class="grid-container-second">


            <!-- Quantity -->
    <div class="grid-item">
                <label for="quantity" class="block text-gray-700">{{ facture_form.quantity.label }}</label>
                <input type="number" name="quantity" id="quantity" value="{{ facture.quantity }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <!-- Percent -->
    <div class="grid-item">
                <label for="percent" class="block text-gray-700">{{ facture_form.percent.label }}</label>
                <input type="number" step="0.01" name="percent" id="percent" value="{{ facture.percent }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <!-- Advance Payment -->
    <div class="grid-item">
                <label for="advance_payment" class="block text-gray-700">{{ facture_form.advance_payment.label }}</label>
                <input type="text" name="advance_payment" id="advance_payment" value="{{ facture.advance_payment }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            </div>

                   <div class="grid-container-third">
            <!-- Total Tax -->
    <div class="grid-item">
                <label for="total_tax" class="block text-gray-700">{{ facture_form.total_tax.label }}</label>
                <input type="number" step="0.01" name="total_tax" id="total_tax" value="{{ facture.total_tax }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <!-- Total Payment After Tax -->
    <div class="grid-item">
                <label for="total_payment_after_tax" class="block text-gray-700">Total Payment After Tax</label>
                <input type="number" step="0.01" name="total_payment_after_tax" id="total_payment_after_tax" value="{{ facture.total_payment_after_tax }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <!-- Total Sum (FR) -->
       <div class="grid-item">
                <label for="total_sum_fr" class="block text-gray-700">Total Sum (FR)</label>
                <textarea name="total_sum_fr" id="total_sum_fr" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ facture.total_sum_fr }}</textarea>
            </div>
            <!-- Advance Payment -->
    <div class="grid-item">
                <label for="advance_payment" class="block text-gray-700">Acompte</label>
                <input type="text" name="advance_payment" id="advance_payment_montant" value="{{ facture.advance_payment }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <!-- Account Number -->
    <div class="grid-item">
                <label for="account_number" class="block text-gray-700">Account Number</label>
                <input type="text" name="account_number" id="account_number" value="{{ facture.account_number }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

                                </div>

        </div>
                        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Submit
            </button>
        </form>
    </div>

</body>
</html>
