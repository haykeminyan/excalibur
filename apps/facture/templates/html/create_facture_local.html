<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %} <!-- Load Django static template tag -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Facture</title>
    <!-- Import Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Import FontAwesome for icons -->
    {% block stylesheets %}
        <link rel="stylesheet" type="text/css" href="{% static 'facture/css/styles.css' %}">
    {% endblock stylesheets %}
</head>
<body class="bg-gray-100">

    <!-- Main Container -->
    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <div class="w-1/5 bg-blue-800 text-white flex flex-col items-center py-8 space-y-8">
            <h2 class="text-2xl font-bold">Dashboard</h2>
            <ul class="space-y-6">
                <li>
                    <a href="{% url 'facture_local_create' %}" class="flex items-center space-x-4 hover:bg-blue-600 p-3 rounded-lg">
                        <i class="fas fa-file-invoice-dollar text-xl"></i>
                        <span>Create Facture</span>
                    </a>
                </li>

                <li>
                    <a href="#" class="flex items-center space-x-4 hover:bg-blue-600 p-3 rounded-lg">
                        <i class="fas fa-chart-line text-xl"></i>
                        <span>Reports</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center space-x-4 hover:bg-blue-600 p-3 rounded-lg">
                        <i class="fas fa-cogs text-xl"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Content Area -->
        <div class="w-4/5 p-10">
            <h1 class="text-4xl font-bold text-blue-800 mb-6">Create New Facture</h1>

            <!-- Form Section -->
            <div class="bg-white p-8 rounded-lg shadow-md">
                <form method="post" action="{% url 'facture_local_create' %}">
                    {% csrf_token %}

                    <div class="grid grid-cols-2 gap-6">
                        <!-- Facture Owner -->
                        <div class="col-span-1">
                            <label for="owner" class="block text-gray-700 font-bold">{{ facture_form.owner.label }}</label>
                            {{ facture_form.owner }}
                        </div>

                        <!-- Facture Number -->
                        <div class="col-span-1">
                            <label for="number_facture" class="block text-gray-700 font-bold">{{ facture_form.number_facture.label }}</label>
                            <input type="number" name="number_facture" id="number_facture" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" value="{{ facture_form.number_facture.value }}">
                        </div>

                        <!-- Facture Date -->
                        <div class="col-span-1">
                            <label for="date" class="block text-gray-700 font-bold">Date</label>
                            <input type="date" name="date" id="date" value="{{ facture.date }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        </div>

                        <!-- Reference -->
                        <div class="col-span-1">
                            <label for="reference" class="block text-gray-700 font-bold">Reference</label>
                            <input type="text" name="reference" id="reference" value="{{ facture.reference }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        </div>

                        <!-- Address -->
                        <div class="col-span-2">
                            <label for="address" class="block text-gray-700 font-bold">Address</label>
                            <textarea name="address" id="address" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ facture.address }}</textarea>
                        </div>
                    </div>

                    <!-- Additional Form Fields -->
                    <div class="grid grid-cols-2 gap-6 mt-6">
                        <div class="col-span-1">
                            <label for="quantity" class="block text-gray-700 font-bold">{{ facture_form.quantity.label }}</label>
                            <input type="number" name="quantity" id="quantity" value="{{ facture.quantity }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        </div>

                        <div class="col-span-1">
                            <label for="percent" class="block text-gray-700 font-bold">{{ facture_form.percent.label }}</label>
                            <input type="number" step="0.01" name="percent" id="percent" value="{{ facture.percent }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        </div>

                        <div class="col-span-1">
                            <label for="total_tax" class="block text-gray-700 font-bold">{{ facture_form.total_tax.label }}</label>
                            <input type="number" step="0.01" name="total_tax" id="total_tax" value="{{ facture.total_tax }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        </div>

                        <div class="col-span-1">
                            <label for="advance_payment" class="block text-gray-700 font-bold">Advance Payment</label>
                            <input type="text" name="advance_payment" id="advance_payment" value="{{ facture.advance_payment }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="mt-8">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">
                            Submit Facture
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
