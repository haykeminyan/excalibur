version: "3.8"

services:
  database:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    networks:
      - excalibur_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    restart: always
    networks:
      - excalibur_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  excalibur:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
          gunicorn excalibur.wsgi:application --bind 0.0.0.0:8000 --timeout 180 --log-level debug;
      "
    volumes:
      - ./apps/facture:/usr/src/app/apps/facture
      - ./apps/deduction:/usr/src/app/apps/deduction
      - ./apps/users:/usr/src/app/apps/users
      - ./apps/main:/usr/src/app/apps/main
      - ./excalibur:/usr/src/app/excalibur
      - ./staticfiles:/usr/src/app/staticfiles
    restart: always
    environment:
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=excalibur.settings
      - ENVIRONMENT=production
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/main/healthcheck/"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    expose:
      - 8000
    ports:
      - "8000:8000"
    networks:
      - excalibur_network
    working_dir: /usr/src/app

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: "on-failure"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - excalibur
    healthcheck:
      test: ["CMD", "curl", "-f", "https://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - excalibur_network
    volumes:
      - ./nginx:/etc/nginx   # Mount Nginx config
      - ./letsencrypt:/etc/letsencrypt  # Mount Certbot certificates
      - ./staticfiles:/usr/src/app/staticfiles
    entrypoint: /bin/bash /entrypoint.sh
    command: ["nginx", "-g", "daemon off;"]  # keep nginx running in foreground

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  letsencrypt:

networks:
  excalibur_network:
    driver: bridge

