# Main events configuration block
events {
    worker_connections 1024;  # Adjust as needed for the number of worker connections
}

# Main HTTP configuration block
http {
    # Include default MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log files
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # HTTP server block - Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pmsolution-facture.org;


        # Allow access to the .well-known directory for Certbot challenges
        location /.well-known/acme-challenge/ {
            root /var/www/html;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server block
    server {
        listen 443 ssl;
        server_name pmsolution-facture.org;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/pmsolution-facture.org/fullchain.pem;  # Full chain from Certbot
        ssl_certificate_key /etc/letsencrypt/live/pmsolution-facture.org/privkey.pem;  # Private key from Certbot

        # SSL settings for security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'HIGH:!aNULL:!MD5';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # OCSP stapling (requires fullchain.pem)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Handle large client requests
        client_max_body_size 20M;

        # Reverse proxy configuration
        location / {
            proxy_pass http://excalibur:8000;  # Forward to Gunicorn (which runs Django on HTTP)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom error pages
        error_page 404 /custom_404.html;
        error_page 500 502 503 504 /custom_50x.html;
        location = /custom_404.html {
            root /usr/share/nginx/html;
        }
        location = /custom_50x.html {
            root /usr/share/nginx/html;
        }
    }
}
