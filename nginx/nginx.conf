# Main events configuration block
events {
    worker_connections 1024;  # Adjust as needed for the expected traffic
}

# Main HTTP configuration block
http {
    # Include default MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log files
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # HTTP server block - Redirect HTTP to HTTPS
    server {
        listen 8080;  # Listen on port 8080 for HTTP requests
        server_name pmsolution-facture.org;

        # Allow access to the .well-known directory for Certbot challenges
        location /.well-known/acme-challenge/ {
            root /var/www/html;  # Challenge directory
            try_files $uri =404;  # Return 404 if file does not exist
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block - Handle SSL traffic
    server {
        listen 443 ssl;  # Listen on port 443 for HTTPS traffic
        server_name pmsolution-facture.org;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/pmsolution-facture.org/fullchain.pem;  # Adjust with your cert path
        ssl_certificate_key /etc/letsencrypt/live/pmsolution-facture.org/privkey.pem;  # Adjust with your cert path

        # SSL settings (for better security)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # Root directory for HTTPS traffic
        root /usr/share/nginx/html;

        # Additional configurations for the server
        location / {
            try_files $uri $uri/ =404;  # Default to 404 if file not found
        }

        # Handle potential HTTP-to-HTTPS redirects in Nginx
        location ~ /.well-known/acme-challenge/ {
            root /var/www/html;
            try_files $uri =404;
        }
    }
}
