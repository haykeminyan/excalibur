events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Server for HTTPS
    server {
        listen 443 ssl;
        server_name pmsolution-facture.org www.pmsolution-facture.org;

        ssl_certificate /etc/letsencrypt/live/pmsolution-facture.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pmsolution-facture.org/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/pmsolution-facture.org/chain.pem;

        # Other SSL settings (optional)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'EECDH+AESGCM:DH+AESGCM:AES128+EECDH:AES128+EDH';
        ssl_prefer_server_ciphers on;

        # Proxy to Django application
        location / {
            proxy_pass http://excalibur:8000;  # Proxy to your Django app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

            location /static/ {
                alias /usr/src/app/staticfiles/;
            }
    }

    # HTTP server block - Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pmsolution-facture.org;

        # Certbot challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

            location /static/ {
                alias /var/www/staticfiles/;
        }


        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
