# Main events configuration block
events {
    worker_connections 1024;  # Adjust as needed for the expected traffic
}

# Main HTTP configuration block
http {
    # Include default MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log files
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # HTTP server block - Redirect HTTP to HTTPS
    server {
        listen 80;  # Updated to listen on port 8080
        server_name pmsolution-facture.org;

        # Allow access to the .well-known directory for Certbot challenges
        location /.well-known/acme-challenge/ {
            root /var/www/html;
            try_files $uri =404;  # Return 404 if the file does not exist
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
