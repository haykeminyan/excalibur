server {
    listen 80;
    server_name pmsolution-facture.org;

    # Allow access to the .well-known directory for Certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;  # The root should be the location where the .well-known directory is mounted
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
