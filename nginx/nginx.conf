worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    client_body_buffer_size 16k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 443 ssl http2 reuseport;

        # Enable QUIC and HTTP/3
        listen [::]:443 ssl http2 reuseport;
        listen 443 quic reuseport;
        server_name pmsolution-facture.org www.pmsolution-facture.org;

        ssl_certificate /etc/letsencrypt/live/pmsolution-facture.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pmsolution-facture.org/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/pmsolution-facture.org/chain.pem;

        # HTTP/3 configuration (QUIC support)
        ssl_protocols TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # HTTP/3 specific
        add_header Alt-Svc 'h3-23=":443"';  # Enable HTTP/3 Alt-Svc
        add_header QUIC-Status $quic;         # Report QUIC connection status

        # Enable QUIC (UDP-based) transport
        quic_max_streams 1000;
        quic_max_connections 100;

        # Configure QUIC retry
        quic_retry_timeout 5s;
        quic_retry 3;

        # Enable the use of the QUIC handshake
        quic_handshake_timeout 10s;

        location / {
            proxy_pass http://excalibur:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffer_size 4k;
            proxy_buffers 16 8k;
            proxy_busy_buffers_size 16k;
            proxy_temp_file_write_size 64k;
        }

        location /static/ {
            alias /usr/src/app/staticfiles/;
            expires max;
            add_header Cache-Control "public";
        }

        location = /favicon.ico {
            alias /usr/src/app/staticfiles/favicon.ico;
            expires 1M;
            add_header Cache-Control "public";
        }
    }

    server {
        listen 80;
        server_name pmsolution-facture.org www.pmsolution-facture.org;

        location /static/ {
            alias /usr/src/app/staticfiles/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
