# Main events configuration block
events {
    worker_connections 1024;  # Adjust as needed for the number of worker connections
}

# Main HTTP configuration block
http {
    # Include default MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP server block - Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pmsolution-facture.org;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server block
    server {
        listen 443 ssl;
        server_name pmsolution-facture.org;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.crt;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL settings for security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'HIGH:!aNULL:!MD5';
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://excalibur:8000;  # Django app running on HTTP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
