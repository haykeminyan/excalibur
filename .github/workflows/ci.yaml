name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      database:
        image: postgres:17
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: > 
          --health-cmd="pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h database" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: > 
          --health-cmd="redis-cli -h redis ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=3

    steps:
      # Check out the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Docker Buildx for better caching and multi-platform builds (optional but recommended)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and start the containers in detached mode
      - name: Build and start containers with docker-compose
        run: |
          docker-compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build

      # Wait for PostgreSQL and Redis to be ready
      - name: Wait for PostgreSQL
        run: |
          docker exec database pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}

      - name: Wait for Redis
        run: |
          docker exec redis redis-cli -h redis ping

      # Run Django migrations
      - name: Run Django migrations
        run: |
          docker-compose exec excalibur python manage.py migrate --noinput

      # Run tests
      - name: Run tests
        run: |
          docker-compose exec excalibur python manage.py test --noinput

      # Clean up
      - name: Shutdown services
        run: docker-compose down

